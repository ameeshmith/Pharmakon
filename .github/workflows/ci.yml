name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest & Evals)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check server tests evals

      - name: Format check with Ruff
        run: uv run ruff format --check server tests evals

      - name: Type check with Mypy
        run: uv run mypy server

      - name: Run Pytest suite
        run: uv run pytest -v --tb=short

      - name: Run Offline Evaluation Suite
        run: uv run python evals/run_evals.py

  frontend:
    name: Frontend (TSC, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test -- --run

      - name: Production build check
        run: npm run build

